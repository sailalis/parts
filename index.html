<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Alice Parts Catalog</title>
  <style>
    /* Layout reset */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; overflow: hidden; font-family: system-ui, sans-serif; }

    /* App frame */
    #app { display: flex; flex-direction: column; height: 100%; width: 100%; min-width: 0; }

    header { flex: 0 0 auto; padding: 16px; background: #f7f7f7; border-bottom: 1px solid #e5e5e5; }
    header h1 { font-size: 20px; margin-bottom: 8px; }
    input { width: 100%; padding: 12px; font-size: 16px; }
    .meta { margin-top: 8px; color: #555; font-size: 14px; }

    main { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: 12px 16px; min-width: 0; }

    /* Table */
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td { border: 1px solid #ddd; padding: 8px; font-size: 14px; vertical-align: top; overflow-wrap: anywhere; }
    th { text-align: left; background: #f7f7f7; position: sticky; top: 0; z-index: 1; }
    .hit { background: #fffae6; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
  <div id="app">
    <header>
      <h1>Alice Parts Catalog</h1>
      <input id="q" placeholder="Start typing…" autofocus />
      <div class="meta" id="meta">Loading…</div>
    </header>

    <main>
      <table id="tbl" aria-label="Search results">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </main>
  </div>

  <script>
    // Config
    const CSV_URL = 'https://raw.githubusercontent.com/sailalis/parts/refs/heads/main/partscatalog.csv';
    const MAX_ROWS = 200;

    let rows = [];
    let headers = [];

    // Simple debounce
    function debounce(fn, ms) {
      let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
    }

    // Highlight helper
    function hi(text, q) {
      if (!q) return text;
      const i = text.toLowerCase().indexOf(q.toLowerCase());
      if (i === -1) return text;
      return text.substring(0, i) + '<span class="hit">' +
             text.substring(i, i+q.length) + '</span>' +
             text.substring(i+q.length);
    }

    // Render table
    function render(data, q) {
      const thead = document.getElementById('thead');
      const tbody = document.getElementById('tbody');
      if (thead.childElementCount === 0 && headers.length) {
        const tr = document.createElement('tr');
        headers.forEach(h => {
          const th = document.createElement('th');
          th.textContent = h;
          tr.appendChild(th);
        });
        thead.appendChild(tr);
      }
      tbody.innerHTML = '';
      data.slice(0, MAX_ROWS).forEach(r => {
        const tr = document.createElement('tr');
        headers.forEach(h => {
          const td = document.createElement('td');
          const val = String(r[h] ?? '');
          td.innerHTML = hi(val, q);
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      const meta = document.getElementById('meta');
      meta.textContent = `Showing ${Math.min(data.length, MAX_ROWS)} of ${data.length} matches` +
                         (data.length > MAX_ROWS ? ' (refine to see more)' : '');
    }

    // Search across all columns
    function search(q) {
      if (!q) { render(rows, ''); return; }
      const ql = q.toLowerCase();
      const filtered = rows.filter(r =>
        headers.some(h => String(r[h] ?? '').toLowerCase().includes(ql))
      );
      render(filtered, q);
    }

    // Wire input
    document.getElementById('q').addEventListener('input', debounce(e => {
      search(e.target.value.trim());
    }, 200));

    // Load CSV
    Papa.parse(CSV_URL, {
      download: true,
      header: true,
      worker: true,
      skipEmptyLines: true,
      complete: (res) => {
        rows = res.data;
        headers = res.meta.fields || Object.keys(rows[0] || {});
        document.getElementById('meta').textContent =
          `Loaded ${rows.length.toLocaleString()} rows`;
        render(rows.slice(0, MAX_ROWS), '');
      },
      error: (err) => {
        document.getElementById('meta').textContent = 'Failed to load CSV: ' + err;
      }
    });
  </script>
</body>
</html>
