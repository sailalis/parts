<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Alice Parts Catalog</title>
  <style>
    /* Reset + frame */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; overflow: hidden; font-family: system-ui, sans-serif; }

    #app { display: flex; flex-direction: column; height: 100%; width: 100%; min-width: 0; }

    header { flex: 0 0 auto; padding: 12px; background: #f7f7f7; border-bottom: 1px solid #e5e5e5; }
    header h1 { font-size: 18px; margin-bottom: 6px; }
    input { width: 100%; padding: 10px; font-size: 14px; }
    .meta { margin-top: 6px; color: #555; font-size: 12px; }

    main { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; min-width: 0; background: #fff; padding: 0; }

    /* Table */
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: auto;          /* auto-size columns */
      margin: 0;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 6px;
      font-size: 13px;
      vertical-align: top;
      overflow-wrap: anywhere;
      word-break: normal;
      white-space: normal;
    }
    thead th {
      position: sticky;
      top: 0;
      background: #f7f7f7;
      z-index: 5;
      box-shadow: 0 2px 0 #ddd;
      margin: 0;
    }
    .hit { background: #fffae6; }

    /* Responsive adjustments */
    @media (max-width: 900px) {
      th, td { font-size: 12px; padding: 5px; }
      header h1 { font-size: 16px; }
      input { font-size: 13px; }
    }

    @media (max-width: 600px) {
      th, td { font-size: 11px; padding: 4px; }
      header h1 { font-size: 14px; }
      input { font-size: 12px; padding: 8px; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
  <div id="app">
    <header>
      <h1>Alice Parts Catalog</h1>
      <input id="q" placeholder="Start typing…" autofocus />
      <div class="meta" id="meta">Loading…</div>
    </header>

    <main>
      <table id="tbl" aria-label="Search results">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </main>
  </div>

  <script>
    // Config
    const CSV_URL = 'https://raw.githubusercontent.com/sailalis/parts/refs/heads/main/partscatalog.csv';
    const MAX_ROWS = 200;

    let rows = [];
    let headers = [];

    function debounce(fn, ms) {
      let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
    }

    function hi(text, q) {
      if (!q) return text;
      const i = text.toLowerCase().indexOf(q.toLowerCase());
      if (i === -1) return text;
      return text.substring(0, i) + '<span class="hit">' +
             text.substring(i, i+q.length) + '</span>' +
             text.substring(i+q.length);
    }

    function render(data, q) {
      const thead = document.getElementById('thead');
      const tbody = document.getElementById('tbody');
      if (thead.childElementCount === 0 && headers.length) {
        const tr = document.createElement('tr');
        headers.forEach(h => {
          const th = document.createElement('th');
          th.textContent = h;
          tr.appendChild(th);
        });
        thead.appendChild(tr);
      }
      tbody.innerHTML = '';
      data.slice(0, MAX_ROWS).forEach(r => {
        const tr = document.createElement('tr');
        headers.forEach(h => {
          const td = document.createElement('td');
          const val = String(r[h] ?? '');
          td.innerHTML = hi(val, q);
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      document.getElementById('meta').textContent =
        `Showing ${Math.min(data.length, MAX_ROWS)} of ${data.length} matches` +
        (data.length > MAX_ROWS ? ' (refine to see more)' : '');
    }

    function search(q) {
      if (!q) { render(rows, ''); return; }
      const ql = q.toLowerCase();
      const filtered = rows.filter(r =>
        headers.some(h => String(r[h] ?? '').toLowerCase().includes(ql))
      );
      render(filtered, q);
    }

    document.getElementById('q').addEventListener('input', debounce(e => {
      search(e.target.value.trim());
    }, 200));

    Papa.parse(CSV_URL, {
      download: true,
      header: true,
      worker: true,
      skipEmptyLines: true,
      complete: (res) => {
        rows = res.data;
        headers = res.meta.fields || Object.keys(rows[0] || {});
        document.getElementById('meta').textContent =
          `Loaded ${rows.length.toLocaleString()} rows`;
        render(rows.slice(0, MAX_ROWS), '');
      },
      error: (err) => {
        document.getElementById('meta').textContent = 'Failed to load CSV: ' + err;
      }
    });
  </script>
</body>
</html>
