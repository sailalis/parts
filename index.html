<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Alice Parts Catalog</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; overflow: hidden; font-family: system-ui, sans-serif; }

    #app { display: flex; flex-direction: column; height: 100%; width: 100%; min-width: 0; }

    header { flex: 0 0 auto; padding: 12px; background: #f7f7f7; border-bottom: 1px solid #e5e5e5; text-align: center; }
    header h1 { font-size: 18px; margin-bottom: 8px; }

    .search-container { display: inline-block; text-align: center; }
    .search-container input { padding: 10px; font-size: 14px; width: 260px; max-width: 90%; }

    .filters { margin-top: 8px; font-size: 13px; text-align: center; }
    .filters label { display: inline-flex; align-items: center; gap: 4px; }

    .meta { margin-top: 6px; color: #555; font-size: 12px; text-align: center; }

    main { flex: 1 1 auto; overflow-y: auto; overflow-x: auto; background: #fff; padding: 0; text-align: center; }

    table { border-collapse: collapse; border-spacing: 0; table-layout: auto; margin: 0 auto; }
    th, td { border: 1px solid #ddd; padding: 6px; font-size: 13px; vertical-align: top; white-space: nowrap; text-align: left; }
    td.noun { white-space: normal; word-break: break-word; }

    /* Fixed group: widths tied to --flagcol, contents centered */
    th.smr, td.smr,
    th.eel, td.eel,
    th.turnin, td.turnin,
    th.serialized, td.serialized {
      width: var(--flagcol, 90px);
      text-align: center;
    }

    /* Name group: widths tied to --namecol */
    th.nomenclature, td.nomenclature,
    th.jsfpn, td.jsfpn,
    th.mfrpn, td.mfrpn {
      width: var(--namecol, auto);
    }

    thead th { position: sticky; top: 0; background: #f7f7f7; z-index: 5; box-shadow: 0 2px 0 #ddd; }
    .hit { background: #fffae6; }

    @media (max-width: 900px) {
      th, td { font-size: 11px; padding: 4px; }
      header h1 { font-size: 16px; }
      .search-container input { font-size: 13px; width: 220px; }
    }
    @media (max-width: 600px) {
      th, td { font-size: 9px; padding: 3px; }
      header h1 { font-size: 14px; }
      .search-container input { font-size: 11px; width: 180px; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
  <div id="app">
    <header>
      <h1>Alice Parts Catalog</h1>
      <div class="search-container">
        <input id="q" placeholder="Start typing…" autofocus />
      </div>
      <div class="filters">
        <label><input type="checkbox" id="hideSmrX" /> Hide non-procurable assets</label>
      </div>
      <div class="meta" id="meta">Loading…</div>
    </header>

    <main>
      <table id="tbl" aria-label="Search results">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </main>
  </div>

  <script>
    const CSV_URL = 'https://raw.githubusercontent.com/sailalis/parts/refs/heads/main/partscatalog.csv';
    const MAX_ROWS = 200;

    let rows = [], headers = [], smrKey = null;

    const norm = (s) => String(s).toLowerCase().replace(/[^a-z0-9]/g, ""); // strip spaces, slashes, dashes, etc.

    function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }

    function hi(text, q){
      if (!q) return text;
      const i = text.toLowerCase().indexOf(q.toLowerCase());
      if (i === -1) return text;
      return text.slice(0,i)+'<span class="hit">'+text.slice(i,i+q.length)+'</span>'+text.slice(i+q.length);
    }

    function assignHeaderClasses(th, hNorm) {
      if (["smr","eel","turnin","serialized"].includes(hNorm)) th.classList.add(hNorm);
      if (hNorm === "turnin") th.classList.add("turnin");
      if (hNorm === "nomenclature") th.classList.add("nomenclature");
      if (hNorm === "jsfpn") th.classList.add("jsfpn");
      if (hNorm === "mfrpn") th.classList.add("mfrpn");
    }
    function assignCellClasses(td, hNorm) {
      if (hNorm === "noun") td.classList.add("noun");
      if (["smr","eel","turnin","serialized"].includes(hNorm)) td.classList.add(hNorm);
      if (hNorm === "nomenclature") td.classList.add("nomenclature");
      if (hNorm === "jsfpn") td.classList.add("jsfpn");
      if (hNorm === "mfrpn") td.classList.add("mfrpn");
    }

    function render(data, q){
      const thead = document.getElementById('thead');
      const tbody = document.getElementById('tbody');

      if (thead.childElementCount === 0 && headers.length){
        const tr = document.createElement('tr');
        headers.forEach(h=>{
          const th = document.createElement('th');
          th.textContent = h;
          assignHeaderClasses(th, norm(h));
          tr.appendChild(th);
        });
        thead.appendChild(tr);
      }

      tbody.innerHTML = '';
      data.slice(0, MAX_ROWS).forEach(r=>{
        const tr = document.createElement('tr');
        headers.forEach(h=>{
          const td = document.createElement('td');
          assignCellClasses(td, norm(h));
          td.innerHTML = hi(String(r[h] ?? ''), q);
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });

      document.getElementById('meta').textContent =
        `Showing ${Math.min(data.length, MAX_ROWS)} of ${data.length} matches` +
        (data.length > MAX_ROWS ? ' (refine to see more)' : '');

      enforceColumnWidths();
    }

    // Make SMR/EEL/TURN-IN match SERIALIZED width. Make JSF P/N and MFR P/N match NOMENCLATURE width.
    function enforceColumnWidths(){
      const table = document.getElementById('tbl');
      const headRow = table.tHead?.rows[0];
      if (!headRow) return;

      // Measure SERIALIZED header width (fallback 90px)
      const serializedTh = headRow.querySelector('th.serialized');
      const flagWidth = Math.max(90, serializedTh ? Math.ceil(serializedTh.getBoundingClientRect().width) : 90);
      table.style.setProperty('--flagcol', flagWidth + 'px');

      // Measure NOMENCLATURE header width for name group
      const nameTh = headRow.querySelector('th.nomenclature');
      if (nameTh){
        const nameWidth = Math.ceil(nameTh.getBoundingClientRect().width);
        table.style.setProperty('--namecol', nameWidth + 'px');
      }
    }

    function applyFilters(data){
      const hideSmrX = document.getElementById('hideSmrX').checked;
      if (hideSmrX && smrKey){
        return data.filter(r=>{
          const v = String(r[smrKey] ?? '');
          return !v || v[0].toLowerCase() !== 'x';
        });
      }
      return data;
    }

    function applyQuery(data, q){
      if (!q) return data;
      const ql = q.toLowerCase();
      return data.filter(r => headers.some(h => String(r[h] ?? '').toLowerCase().includes(ql)));
    }

    function updateView(){
      const q = document.getElementById('q').value.trim();
      const afterFilter = applyFilters(rows);
      const afterQuery = applyQuery(afterFilter, q);
      render(afterQuery, q);
    }

    document.getElementById('q').addEventListener('input', debounce(updateView, 200));
    document.getElementById('hideSmrX').addEventListener('change', updateView);

    Papa.parse(CSV_URL, {
      download: true, header: true, worker: true, skipEmptyLines: true,
      complete: (res) => {
        rows = res.data;
        headers = res.meta.fields || Object.keys(rows[0] || {});
        smrKey = headers.find(h => norm(h) === 'smr') || null;
