<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Alice Parts Catalog</title>
  <style>
    :root{
      --namecol: 220px;   /* NOMENCLATURE + JSF P/N + MFR P/N */
      --flagcol: 90px;    /* SMR + EEL + TURN-IN + SERIALIZED */
    }

    /* Reset + frame */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; overflow: hidden; font-family: system-ui, sans-serif; }

    #app { display: flex; flex-direction: column; height: 100%; width: 100%; min-width: 0; }
    header { flex: 0 0 auto; padding: 12px; background: #f7f7f7; border-bottom: 1px solid #e5e5e5; text-align: center; }
    header h1 { font-size: 18px; margin-bottom: 8px; }
    .search { display: inline-block; }
    .search input { padding: 10px; font-size: 14px; width: 260px; max-width: 90vw; }
    .meta { margin-top: 6px; color: #555; font-size: 12px; text-align: center; }

    main { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; background:#fff; padding:0; text-align:center; }

    /* Table centered, no full-width stretch */
    table { border-collapse: separate; border-spacing: 0; table-layout: auto; margin: 0 auto; }
    th, td { border: 1px solid #ddd; padding: 6px; font-size: 13px; vertical-align: top; white-space: nowrap; text-align: left; }
    thead th { position: sticky; top: 0; background: #f7f7f7; z-index: 5; box-shadow: 0 2px 0 #ddd; }
    .hit { background: #fffae6; }

    /* Only NOUN may wrap if present */
    td.noun { white-space: normal; word-break: break-word; }

    /* Fixed width groups */
    /* NOMENCLATURE group: same width as --namecol */
    th.nomenclature, td.nomenclature,
    th.jsfpn, td.jsfpn,
    th.mfrpn, td.mfrpn {
      width: var(--namecol);
    }

    /* Flags group: same width as --flagcol and centered contents */
    th.smr, td.smr,
    th.eel, td.eel,
    th.turnin, td.turnin,
    th.serialized, td.serialized {
      width: var(--flagcol);
      text-align: center !important;
      vertical-align: middle;
    }

    /* Responsive font tweaks */
    @media (max-width: 900px) {
      th, td { font-size: 11px; padding: 4px; }
      header h1 { font-size: 16px; }
      .search input { font-size: 13px; width: 220px; }
    }
    @media (max-width: 600px) {
      th, td { font-size: 9px; padding: 3px; }
      header h1 { font-size: 14px; }
      .search input { font-size: 11px; width: 180px; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
  <div id="app">
    <header>
      <h1>Alice Parts Catalog</h1>
      <div class="search"><input id="q" placeholder="Start typing…" autofocus /></div>
      <div style="margin-top:8px;">
        <label style="font-size:13px; display:inline-flex; align-items:center; gap:6px;">
          <input type="checkbox" id="hideSmrX" />
          Hide non-procurable assets
        </label>
      </div>
      <div class="meta" id="meta">Loading…</div>
    </header>

    <main>
      <table id="tbl" aria-label="Search results">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </main>
  </div>

  <script>
    const CSV_URL = 'https://raw.githubusercontent.com/sailalis/parts/refs/heads/main/partscatalognew.csv';
    const MAX_ROWS = 200;

    let rows = [], headers = [], smrKey = null;

    const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, ''); // normalize header names

    function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }

    function hi(text, q){
      if (!q) return text;
      const i = text.toLowerCase().indexOf(q.toLowerCase());
      if (i === -1) return text;
      return text.slice(0,i) + '<span class="hit">' + text.slice(i,i+q.length) + '</span>' + text.slice(i+q.length);
    }

    function addHeaderClasses(th, key){
      if (key === 'nomenclature') th.classList.add('nomenclature');
      if (key === 'jsfpn') th.classList.add('jsfpn');
      if (key === 'mfrpn') th.classList.add('mfrpn');
      if (['smr','eel','turnin','serialized'].includes(key)) th.classList.add(key);
    }
    function addCellClasses(td, key){
      if (key === 'noun') td.classList.add('noun'); // only NOUN may wrap
      if (key === 'nomenclature') td.classList.add('nomenclature');
      if (key === 'jsfpn') td.classList.add('jsfpn');
      if (key === 'mfrpn') td.classList.add('mfrpn');
      if (['smr','eel','turnin','serialized'].includes(key)) td.classList.add(key);
    }

    function render(data, q){
      const thead = document.getElementById('thead');
      const tbody = document.getElementById('tbody');

      if (thead.childElementCount === 0 && headers.length){
        const tr = document.createElement('tr');
        headers.forEach(h=>{
          const th = document.createElement('th');
          th.textContent = h;
          addHeaderClasses(th, norm(h));
          tr.appendChild(th);
        });
        thead.appendChild(tr);
      }

      tbody.innerHTML = '';
      data.slice(0, MAX_ROWS).forEach(r=>{
        const tr = document.createElement('tr');
        headers.forEach(h=>{
          const td = document.createElement('td');
          addCellClasses(td, norm(h));
          td.innerHTML = hi(String(r[h] ?? ''), q);
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });

      document.getElementById('meta').textContent =
        `Showing ${Math.min(data.length, MAX_ROWS)} of ${data.length} matches` +
        (data.length > MAX_ROWS ? ' (refine to see more)' : '');
    }

    function applyFilters(data){
      const hide = document.getElementById('hideSmrX').checked;
      if (hide && smrKey){
        return data.filter(r=>{
          const v = String(r[smrKey] ?? '');
          return !v || v[0].toLowerCase() !== 'x';
        });
      }
      return data;
    }

    function applyQuery(data, q){
      if (!q) return data;
      const ql = q.toLowerCase();
      return data.filter(r => headers.some(h => String(r[h] ?? '').toLowerCase().includes(ql)));
    }

    function updateView(){
      const q = document.getElementById('q').value.trim();
      render(applyQuery(applyFilters(rows), q), q);
    }

    document.getElementById('q').addEventListener('input', debounce(updateView, 200));
    document.getElementById('hideSmrX').addEventListener('change', updateView);

    Papa.parse(CSV_URL, {
      download: true, header: true, worker: true, skipEmptyLines: true,
      complete: (res) => {
        rows = res.data;
        headers = res.meta.fields || Object.keys(rows[0] || {});
        smrKey = headers.find(h => norm(h) === 'smr') || null;
        document.getElementById('meta').textContent = `Loaded ${rows.length.toLocaleString()} rows`;
        updateView();
      },
      error: (err) => { document.getElementById('meta').textContent = 'Failed to load CSV: ' + err; }
    });
  </script>
</body>
</html>
