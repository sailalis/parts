<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Alice Parts Catalog</title>
  <style>
  /* Reset + frame */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; width: 100%; overflow: hidden; font-family: system-ui, sans-serif; }

  #app { display: flex; flex-direction: column; height: 100%; width: 100%; min-width: 0; }
  header { flex: 0 0 auto; padding: 16px; background: #f7f7f7; border-bottom: 1px solid #e5e5e5; text-align:center; }
  header h1 { font-size: 20px; margin-bottom: 8px; }
  input { width: auto; max-width: 90%; padding: 12px; font-size: 16px; display:block; margin: 0 auto; }
  .meta { margin-top: 8px; color: #555; font-size: 14px; }

  main { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; background:#fff; padding:0; text-align:center; }
  .table-wrap { display:inline-block; position:relative; }
  .table-scale {
    transform-origin: top center;
    will-change: transform, height;
  }

  /* Table */
  table { border-collapse: separate; border-spacing: 0; }
  th, td { border: 1px solid #ddd; padding: 6px; font-size: 13px; vertical-align: top; text-align: left; }
  thead th {
    position: sticky;
    top: 0;
    background: #f7f7f7;
    z-index: 5;
    box-shadow: 0 2px 0 #ddd;
  }

  /* Highlight */
  .hit { background: #fffae6; }

  /* Fixed width + center aligned cols */
  th.smr, td.smr,
  th.eel, td.eel,
  th.turnin, td.turnin,
  th.serialized, td.serialized {
    width: 90px;
    text-align: center !important;
    vertical-align: middle;
  }

  /* Responsive font tweaks */
  @media (max-width: 768px) {
    th, td { font-size: 11px; padding: 4px; }
    th.noun, td.noun { white-space: normal; } /* allow wrapping only for noun */
    th, td { white-space: nowrap; } /* all others stay single-line */
  }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
  <div id="app">
    <header>
      <h1>Alice Parts Catalog</h1>
      <input id="q" placeholder="Start typing…" autofocus />
      <div class="meta" id="meta">Loading…</div>
    </header>

    <main>
      <div id="tableWrap" class="table-wrap">
        <div id="tableScale" class="table-scale">
          <table id="tbl" aria-label="Search results">
            <thead id="thead"></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Config
    const CSV_URL = 'https://raw.githubusercontent.com/sailalis/parts/refs/heads/main/partscatalognew.csv';
    const MAX_ROWS = 200;

    let rows = [];
    let headers = [];

    // Debounce
    function debounce(fn, ms) {
      let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
    }

    // Highlight
    function hi(text, q) {
      if (!q) return text;
      const i = text.toLowerCase().indexOf(q.toLowerCase());
      if (i === -1) return text;
      return text.substring(0, i) + '<span class="hit">' +
             text.substring(i, i+q.length) + '</span>' +
             text.substring(i+q.length);
    }

    // Render
    function render(data, q) {
      const thead = document.getElementById('thead');
      const tbody = document.getElementById('tbody');
      if (thead.childElementCount === 0 && headers.length) {
        const tr = document.createElement('tr');
        headers.forEach(h => {
          const th = document.createElement('th');
          th.textContent = h;
          const cname = h.trim().toLowerCase().replace(/[^a-z0-9]+/g,'');
          if (['smr','eel','turnin','serialized'].includes(cname)) th.classList.add(cname);
          if (['jsfpn','mfrpn','nomenclature'].includes(cname)) th.classList.add(cname);
          tr.appendChild(th);
        });
        thead.appendChild(tr);
      }
      tbody.innerHTML = '';
      data.slice(0, MAX_ROWS).forEach(r => {
        const tr = document.createElement('tr');
        headers.forEach(h => {
          const td = document.createElement('td');
          const val = String(r[h] ?? '');
          td.innerHTML = hi(val, q);
          const cname = h.trim().toLowerCase().replace(/[^a-z0-9]+/g,'');
          if (['smr','eel','turnin','serialized'].includes(cname)) td.classList.add(cname);
          if (['jsfpn','mfrpn','nomenclature'].includes(cname)) td.classList.add(cname);
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      document.getElementById('meta').textContent =
        `Showing ${Math.min(data.length, MAX_ROWS)} of ${data.length} matches` +
        (data.length > MAX_ROWS ? ' (refine to see more)' : '');
      requestAnimationFrame(fitTable);
    }

    // Search
    function search(q) {
      if (!q) { render(rows, ''); return; }
      const ql = q.toLowerCase();
      const filtered = rows.filter(r =>
        headers.some(h => String(r[h] ?? '').toLowerCase().includes(ql))
      );
      render(filtered, q);
    }

    document.getElementById('q').addEventListener('input', debounce(e => {
      search(e.target.value.trim());
    }, 200));

    // Fit to screen
    function fitTable() {
      const wrap = document.getElementById('tableWrap');
      const scaleBox = document.getElementById('tableScale');
      const tbl = document.getElementById('tbl');
      const naturalWidth = tbl.scrollWidth;
      const available = wrap.parentElement.clientWidth;
      const scale = Math.min(1, available / naturalWidth);
      scaleBox.style.transform = `scale(${scale})`;
      scaleBox.style.width = naturalWidth + 'px';
      scaleBox.style.height = (tbl.getBoundingClientRect().height * scale) + 'px';
    }
    window.addEventListener('resize', fitTable);

    // Load CSV
    Papa.parse(CSV_URL, {
      download: true,
      header: true,
      worker: true,
      skipEmptyLines: true,
      complete: (res) => {
        rows = res.data;
        headers = res.meta.fields || Object.keys(rows[0] || {});
        document.getElementById('meta').textContent =
          `Loaded ${rows.length.toLocaleString()} rows`;
        render(rows.slice(0, MAX_ROWS), '');
      },
      error: (err) => {
        document.getElementById('meta').textContent = 'Failed to load CSV: ' + err;
      }
    });
  </script>
</body>
</html>
